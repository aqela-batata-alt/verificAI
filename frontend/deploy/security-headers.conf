# Cabeçalhos de segurança do Apura Web (RNF16). Incluído em cada "location" que define os próprios
# cabeçalhos: no nginx, um add_header dentro de uma location substitui os do nível acima.
#
# A política de conteúdo (CSP) só permite o que a interface usa: scripts, estilos, fontes e imagens do
# próprio site e chamadas de rede à própria origem (a API fica em /api/, ADR-006). Não há script nem
# estilo embutido no HTML. Os estilos que o React aplica por código (propriedades CSS como --value)
# não passam pela CSP de estilo. Se a API passar a ficar em outra origem, acrescente essa origem a
# connect-src (e libere X-Visitor-Id no CORS do back end).

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Com HTTPS no ar (o certificado costuma ficar no balanceador ou num nginx na frente), ative:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
