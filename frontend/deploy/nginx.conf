# Apura Web: nginx que serve a interface estática em "/" e repassa "/api/" ao Django (mesma origem).
# ADR-006 (proposta, a confirmar): na mesma origem, o cookie de sessão SameSite=Lax das contas
# (Etapa 4) funciona sem configurar CORS.
#
# Este arquivo substitui nginx/default.conf do repositório do back end (verificAI): mantém o que
# aquele arquivo faz (proxy para web:8000, /static/ do Django, limite de 35 s para a análise) e
# acrescenta a interface, a política de segurança e o cache. Serve como /etc/nginx/conf.d/default.conf.
#
# Esta configuração foi escrita e revisada, mas não executada num nginx de verdade durante o
# desenvolvimento (não havia nginx nem Docker disponíveis): rode "nginx -t" antes de publicar.

server {
    listen 80;
    server_name _;

    server_tokens off;
    # O texto analisado tem até 5.000 caracteres: 1 MB sobra, e o back end também limita.
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    include /etc/nginx/snippets/apura-security-headers.conf;

    # Verificação de saúde do contêiner da interface (não consulta a API).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API v1 (Django). A interface espera no máximo 30 s (RNF01); o nginx espera 35 s, como no
    # nginx do back end, para a API responder o erro dela antes de a conexão ser cortada.
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Só o endereço que este nginx enxerga, sem repassar um X-Forwarded-For enviado pelo cliente:
        # o limite de requisições do DRF identifica a pessoa por esse cabeçalho, e um valor falsificado
        # contornaria o limite. Se houver outro proxy na frente, configure o módulo realip em vez disto.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;

        # As respostas da API têm cabeçalhos próprios do Django; estes são trocados pelos daqui para
        # não aparecerem duplicados. Resultados de análise não ficam em cache do navegador nem de proxy.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/apura-security-headers.conf;
    }

    # Administração e arquivos estáticos do Django (como no nginx do back end). Se a administração não
    # deve ficar pública, apague o bloco /admin/.
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }

    location /static/ {
        alias /code/apura/static/;
        expires 7d;
    }

    # Arquivos da interface com hash no nome: nunca mudam, podem ficar um ano em cache.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/apura-security-headers.conf;
    }

    # A página de entrada e os ícones sempre são revalidados, para a pessoa receber a versão nova
    # depois de uma publicação. Rotas da interface (/resultado/…, /historico…) caem em index.html:
    # o roteador do navegador mostra a tela certa (ou a página "não encontrada").
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/apura-security-headers.conf;
    }
}
